<!DOCTYPE html>
<!-- SmartBin ESEG - Painel web | Grupo: Juan, Cauã e Bruno Spinelli -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBin ESEG</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121214;
      --surface: #202024;
      --surface-2: #26262b;
      --border: #2c2c31;
      --border-strong: #3a3a41;
      --text: #f4f4f5;
      --muted: #8d8d99;
      --green: #22c55e;
      --red: #ef4444;
      --accent: #4f7cff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background-color: var(--bg);
      background-image:
        radial-gradient(70% 50% at 50% 0%, rgba(79, 124, 255, 0.10) 0%, transparent 70%),
        radial-gradient(60% 45% at 50% 100%, rgba(34, 197, 94, 0.05) 0%, transparent 70%);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ---------- Topo ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 4px;
      margin-bottom: 2px;
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

    .brand-mark {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      color: #d4d4d8;
    }

    .brand-text h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .brand-text span { font-size: 0.76rem; color: var(--muted); }

    .conn-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(32, 32, 36, 0.9);
      border: 1px solid var(--border);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #52525b;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .dot.online {
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.16);
      animation: breathe 2.6s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.16); }
      50%      { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.05); }
    }

    /* ---------- Cartão ---------- */
    .status-card {
      position: relative;
      overflow: hidden;
      padding: 30px 26px 30px;
      border-radius: 28px;
      border: 1px solid var(--border);
      background: linear-gradient(165deg, #202024 0%, #1a1a1e 100%);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      text-align: center;
      isolation: isolate;
    }

    .status-card::before {
      content: '';
      position: absolute;
      top: -190px;
      left: 50%;
      width: 360px;
      height: 360px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34, 197, 94, 0.18) 0%, transparent 68%);
      filter: blur(6px);
      transition: background 0.6s ease;
      z-index: -1;
    }

    .status-card.is-cheia::before {
      background: radial-gradient(circle, rgba(239, 68, 68, 0.22) 0%, transparent 68%);
    }

    /* ---------- Lixeira 3D ---------- */
    .bin-stage {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 250px;
      margin-bottom: 26px;
    }

    /* A perspectiva fica no proprio .bin (contexto plano), assim a tampa nao
       atravessa a boca/aro ao inclinar e nunca e recortada por tras. */
    .bin {
      position: relative;
      width: 148px;
      height: 196px;
      perspective: 800px;
      perspective-origin: 50% 30%;
    }

    /* Corpo */
    .bin-body {
      position: absolute;
      inset: 16px 0 0 0;
      border-radius: 8px 8px 34px 34px / 6px 6px 40px 40px;
      background: linear-gradient(90deg, #0d0d10 0%, #24242b 26%, #3b3b45 48%, #2b2b32 62%, #171719 82%, #0c0c0f 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.10),
        inset -14px 0 26px rgba(0, 0, 0, 0.55),
        inset 14px 0 22px rgba(0, 0, 0, 0.35),
        0 26px 36px -14px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      transition: box-shadow 0.5s ease;
    }

    .status-card.is-cheia .bin-body {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.10),
        inset -14px 0 26px rgba(0, 0, 0, 0.55),
        inset 0 0 44px rgba(239, 68, 68, 0.18),
        0 26px 36px -14px rgba(0, 0, 0, 0.85),
        0 0 42px rgba(239, 68, 68, 0.14);
    }

    /* Nível */
    .bin-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 20%;
      background: linear-gradient(180deg, #2fd671 0%, #15a34b 55%, #0c7136 100%);
      box-shadow: 0 -8px 18px rgba(34, 197, 94, 0.35);
      transition: height 0.9s cubic-bezier(0.22, 1, 0.36, 1), background 0.6s ease, box-shadow 0.6s ease;
    }

    .bin-fill::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 5%;
      right: 5%;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(167, 243, 208, 0.75), rgba(34, 197, 94, 0.12));
      transition: background 0.6s ease;
    }

    .bin-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0) 30%,
        rgba(255, 255, 255, 0.10) 48%, rgba(0, 0, 0, 0) 66%,
        rgba(0, 0, 0, 0.5) 100%);
    }

    .status-card.is-cheia .bin-fill {
      background: linear-gradient(180deg, #f05252 0%, #cf2727 55%, #961b1b 100%);
      box-shadow: 0 -8px 22px rgba(239, 68, 68, 0.45);
    }

    .status-card.is-cheia .bin-fill::before {
      background: linear-gradient(180deg, rgba(254, 202, 202, 0.8), rgba(239, 68, 68, 0.16));
    }

    /* Verniz do corpo */
    .bin-glass {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(102deg,
        rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.02) 16%,
        rgba(0, 0, 0, 0) 38%, rgba(0, 0, 0, 0.26) 70%, rgba(0, 0, 0, 0.55) 100%);
      box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.55);
    }

    /* Boca do compartimento */
    .bin-rim {
      position: absolute;
      top: 6px;
      left: -4px;
      right: -4px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(ellipse 62% 100% at 50% 45%, #050507 0%, #0a0a0d 58%, #32323a 84%, #1b1b21 100%);
      box-shadow:
        inset 0 5px 10px rgba(0, 0, 0, 0.95),
        0 1px 0 rgba(255, 255, 255, 0.07);
      transition: box-shadow 0.5s ease;
      z-index: 2;
    }

    .bin-rim::after {
      content: '';
      position: absolute;
      inset: 4px 12px 6px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 50%, rgba(34, 197, 94, 0.45) 0%, transparent 72%);
      opacity: 0;
      transition: opacity 0.45s ease 0.12s, background 0.5s ease;
      filter: blur(1px);
    }

    .bin.aberta .bin-rim::after { opacity: 1; }

    .status-card.is-cheia .bin.aberta .bin-rim::after {
      background: radial-gradient(ellipse at 50% 50%, rgba(239, 68, 68, 0.5) 0%, transparent 72%);
    }

    /* Tampa: lâmina oval com dobradiça na traseira */
    .bin-lid {
      position: absolute;
      top: -3px;
      left: -11px;
      right: -11px;
      height: 27px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0) 44%),
        radial-gradient(ellipse 72% 130% at 50% 6%, #5c5c68 0%, #44444f 36%, #2d2d35 70%, #1e1e24 100%);
      box-shadow:
        0 4px 0 -1px #15151a,
        0 9px 20px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.24);
      transform-origin: 50% 50%;
      transform: translateY(0) rotateX(0deg) scale(1);
      transition: transform 0.62s cubic-bezier(0.3, 1.18, 0.5, 1), box-shadow 0.4s ease;
      z-index: 7;
    }

    .bin-lid::after {
      content: '';
      position: absolute;
      top: 11px;
      left: 11px;
      right: 11px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.22));
    }

    .bin-handle {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 4px;
      border-radius: 99px;
      background: linear-gradient(180deg, #191920 0%, #2b2b33 100%);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(255, 255, 255, 0.07);
      z-index: 2;
    }

    /* Abre levantando e inclinando para trás, sem sumir de perfil */
    .bin.aberta .bin-lid {
      transform: translateY(-38px) rotateX(-22deg) scale(1.03);
      box-shadow:
        0 22px 34px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    /* Sombra no chão */
    .bin-ground {
      position: absolute;
      left: -22%;
      right: -22%;
      bottom: -16px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(34, 197, 94, 0.22), transparent 70%);
      filter: blur(7px);
      transition: background 0.6s ease;
      z-index: -1;
    }

    .status-card.is-cheia .bin-ground {
      background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(239, 68, 68, 0.3), transparent 70%);
    }

    /* ---------- Status ---------- */
    .status-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status-label .dot { width: 6px; height: 6px; background: #52525b; }
    .status-card.is-normal .status-label .dot { background: var(--green); }
    .status-card.is-cheia .status-label .dot { background: var(--red); }

    .status-value {
      margin-top: 12px;
      font-size: clamp(2.9rem, 14vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      color: var(--muted);
      transition: color 0.4s ease;
    }

    .status-value.pop { animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

    @keyframes pop {
      0%   { transform: scale(0.94); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }

    .status-hint {
      margin-top: 12px;
      font-size: 0.86rem;
      color: var(--muted);
      transition: color 0.4s ease;
    }

    .status-card.is-cheia .status-hint { color: #fca5a5; }
    .status-card.is-normal .status-hint { color: #86efac; }

    .level-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(18, 18, 20, 0.55);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #c9c9d1;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Ações ---------- */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      appearance: none;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 600;
      height: 58px;
      border-radius: 18px;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.18s ease, background 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease, color 0.22s ease, opacity 0.2s;
    }

    .btn-abrir {
      background: var(--text);
      color: #121214;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }

    .btn-abrir:hover {
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.45);
    }

    .btn-fechar {
      background: var(--surface);
      color: #d4d4d8;
      border-color: var(--border-strong);
    }

    .btn-fechar:hover {
      background: var(--surface-2);
      color: var(--text);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
    }

    .btn:active { transform: scale(0.975); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ---------- Aviso ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translate(-50%, 16px);
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(32, 32, 36, 0.96);
      border: 1px solid var(--border-strong);
      color: #e4e4e7;
      font-size: 0.78rem;
      font-weight: 500;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 380px) {
      .actions { grid-template-columns: 1fr; }
      .bin-stage { height: 220px; }
    }

    .grupo {
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .grupo strong { color: var(--text); font-weight: 600; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <div class="shell">

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M8 6V4h8v2"></path>
            <path d="M6 6l1 14h10l1-14"></path>
            <path d="M10 11v5M14 11v5"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>SmartBin ESEG</h1>
          <span>Painel de controle</span>
        </div>
      </div>

      <div class="conn-pill">
        <span id="connDot" class="dot"></span>
        <span id="connText">CONECTANDO</span>
      </div>
    </header>

    <main id="statusCard" class="status-card" aria-live="polite">

      <div class="bin-stage">
        <div id="bin" class="bin">
          <div class="bin-lid">
            <span class="bin-handle"></span>
          </div>
          <div class="bin-body">
            <div id="binFill" class="bin-fill"></div>
            <div class="bin-glass"></div>
          </div>
          <div class="bin-rim"></div>
          <div class="bin-ground"></div>
        </div>
      </div>

      <div class="status-label">
        <span class="dot"></span>
        Status da lixeira
      </div>
      <div id="statusVal" class="status-value">&mdash;</div>
      <p id="statusHint" class="status-hint">Aguardando leitura do sensor</p>
      <div id="nivelVal" class="level-badge">&mdash;</div>
    </main>

    <div class="actions">
      <button class="btn btn-abrir" type="button" data-comando="abrir">Abrir</button>
      <button class="btn btn-fechar" type="button" data-comando="fechar">Fechar</button>
    </div>

    <footer class="grupo">
      Grupo: <strong>Juan</strong>, <strong>Cauã</strong> e <strong>Bruno Spinelli</strong>
    </footer>

  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const statusCard = document.getElementById('statusCard');
    const statusVal = document.getElementById('statusVal');
    const statusHint = document.getElementById('statusHint');
    const nivelVal = document.getElementById('nivelVal');
    const connDot = document.getElementById('connDot');
    const connText = document.getElementById('connText');
    const bin = document.getElementById('bin');
    const binFill = document.getElementById('binFill');
    const toast = document.getElementById('toast');
    const botoes = document.querySelectorAll('[data-comando]');

    const LIMITE_CHEIA = 80; // a partir de 80% o painel entra em alerta
    const LIMITE_VAZIA = 15; // ate 15% conta como vazia
    let avisoTimer = null;
    let ressincTimer = null;
    let estadoAtual = null;   // 'vazia' | 'normal' | 'cheia'
    let tampaAberta = false;  // estado real enviado pelo Arduino

    function avisar(mensagem) {
      toast.textContent = mensagem;
      toast.classList.add('show');
      clearTimeout(avisoTimer);
      avisoTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // A tampa agora e controlada pelo sensor de mao (fora da caixa), nao pelo nivel
    function sincronizarTampa() {
      bin.classList.toggle('aberta', tampaAberta);
    }

    // Comando manual: mostra na hora; o Arduino confirma pelo topico da tampa
    function moverTampa(aberta) {
      bin.classList.toggle('aberta', aberta);
      clearTimeout(ressincTimer);
      ressincTimer = setTimeout(sincronizarTampa, 3000);
    }

    const ESTADOS = {
      vazia:  { texto: 'VAZIA',  cor: 'var(--green)', dica: 'Lixeira vazia',                                 nivel: 5 },
      normal: { texto: 'NORMAL', cor: 'var(--green)', dica: 'Compartimento livre para uso',                  nivel: 50 },
      cheia:  { texto: 'CHEIA',  cor: 'var(--red)',   dica: 'Compartimento cheio — necessita esvaziamento', nivel: 90 },
    };

    // Desenha o estado recebido da lixeira (nivel opcional em %)
    function aplicarEstado(estado, nivel) {
      const info = ESTADOS[estado];
      if (!info) return;
      const valor = Math.max(0, Math.min(100, Math.round(nivel ?? info.nivel)));
      const cheia = estado === 'cheia';

      binFill.style.height = `${Math.max(valor, 3)}%`;
      statusCard.classList.toggle('is-cheia', cheia);
      statusCard.classList.toggle('is-normal', !cheia);

      if (statusVal.innerText !== info.texto) {
        statusVal.innerText = info.texto;
        statusVal.classList.remove('pop');
        void statusVal.offsetWidth;
        statusVal.classList.add('pop');
      }
      statusVal.style.color = info.cor;
      statusHint.innerText = info.dica;
      nivelVal.innerText = nivel === undefined ? info.texto.toLowerCase() : `${valor}% ocupado`;

      // Aviso quando o estado muda (nao no primeiro carregamento)
      if (estadoAtual !== null && estadoAtual !== estado) {
        avisar(cheia ? 'Atenção: lixeira CHEIA!' : `Lixeira agora está ${info.texto}`);
      }
      estadoAtual = estado;
    }

    // Aceita "vazia"/"normal"/"cheia" (Arduino) ou um número/percentual ("50", "90%")
    function interpretarStatus(status) {
      if (status === null || status === undefined) return null;
      const texto = String(status).trim().toLowerCase();

      if (ESTADOS[texto]) return { estado: texto };

      const casou = texto.match(/^(\d{1,3})\s*%?$/);
      if (casou) {
        const n = Number(casou[1]);
        const estado = n >= LIMITE_CHEIA ? 'cheia' : n <= LIMITE_VAZIA ? 'vazia' : 'normal';
        return { estado, nivel: n };
      }

      return null;
    }

    socket.on('connect', () => {
      connDot.classList.add('online');
      connText.innerText = 'ONLINE';
      botoes.forEach((btn) => (btn.disabled = false));
    });

    socket.on('disconnect', () => {
      connDot.classList.remove('online');
      connText.innerText = 'OFFLINE';
      botoes.forEach((btn) => (btn.disabled = true));
    });

    socket.on('lixeiraStatus', (status) => {
      const lido = interpretarStatus(status);
      if (lido === null) return;
      aplicarEstado(lido.estado, lido.nivel);
    });

    socket.on('lixeiraTampa', (tampa) => {
      tampaAberta = String(tampa).trim().toLowerCase() === 'aberta';
      clearTimeout(ressincTimer);
      sincronizarTampa();
    });

    botoes.forEach((btn) => {
      btn.addEventListener('click', () => {
        const acao = btn.dataset.comando;
        socket.emit('enviarComando', acao);
        moverTampa(acao === 'abrir');
        avisar(acao === 'abrir' ? 'Comando enviado: abrir tampa' : 'Comando enviado: fechar tampa');
      });
    });

    // Botões só são liberados quando o servidor conectar
    botoes.forEach((btn) => (btn.disabled = true));
  </script>
</body>
</html>
